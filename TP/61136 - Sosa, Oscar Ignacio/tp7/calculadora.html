<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora React</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #b80202;
            text-align: center;
        }
        .calculadora {
            font-family: Arial, sans-serif;
            background-color: #248bcf;
            padding: 20px;
            border-radius: 5px;
            color: rgb(182, 22, 22);
        }
        input {
            margin: 5px;
        }
        button {
            margin: 5px;
        }
    </style>
</head>
<body>
    <div id="root"></div>
    <!-- React y ReactDOM desde CDN -->
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <!-- Babel para JSX en el navegador -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>

    <script type="text/babel">
        const { useState } = React;

        function Calculadora() {
            const [num1, setNum1] = useState('');
            const [num2, setNum2] = useState('');
            const [resultado, setResultado] = useState('');

            const calcular = (operador) => {
                const n1 = parseFloat(num1);
                const n2 = parseFloat(num2);
                if (isNaN(n1) || isNaN(n2)) {
                    setResultado('Ingrese ambos números');
                    return;
                }
                let res = '';
                switch (operador) {
                    case '+': res = n1 + n2; break;
                    case '-': res = n1 - n2; break;
                    case '*': res = n1 * n2; break;
                    case '/': res = n2 !== 0 ? n1 / n2 : 'No se puede dividir por 0'; break;
                    default: res = '';
                }
                setResultado(res);
            };

            return (
                <div className="calculadora">
                    <h2>Calculadora React</h2>
                    <input
                        type="number"
                        value={num1}
                        onChange={e => setNum1(e.target.value)}
                        placeholder="Número 1"
                    />
                    <input
                        type="number"
                        value={num2}
                        onChange={e => setNum2(e.target.value)}
                        placeholder="Número 2"
                    />
                    <div>
                        <button onClick={() => calcular('+')}>Suma</button>
                        <button onClick={() => calcular('-')}>Resta</button>
                        <button onClick={() => calcular('*')}>Multiplicación</button>
                        <button onClick={() => calcular('/')}>División</button>
                    </div>
                    <h3>Resultado: {resultado}</h3>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<Calculadora />);
    </script>
</body>
</html>
