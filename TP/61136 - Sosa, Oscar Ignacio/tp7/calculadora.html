<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora React</title>

    <style>
        foundation {
            font-family: Arial, sans-serif;
            background-color: #b80c0c;
            padding: 20px;
            border-radius: 5px;
            color: red;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #b80202;
            text-align: center;
        }
    </style>
</head>
<body>
    <div>
        <input type="number" id="num1" placeholder="Número 1">
        <input type="number" id="num2" placeholder="Número 2">
    </div>
    <div>
        <button onclick="calcular('+')">Suma</button>
        <button onclick="calcular('-')">Resta</button>
        <button onclick="calcular('*')">Multiplicación</button>
        <button onclick="calcular('/')">División</button>
    <div id="root"></div>
<!-- React y ReactDOM desde CDN -->
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<!-- Babel para JSX en el navegador -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function Calculadora(){
            // Poner aca el JavaScript
            return <h1><center>1+2=?</center></h1>;
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<Calculadora />);
    </script>
</body>
</html>
